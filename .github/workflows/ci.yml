name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  offline-acceptance:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Unit tests
        run: PYTHONPATH=src python3 -m unittest discover -s tests -v
      - name: Validate canonical data
        run: PYTHONPATH=src python3 -m wbc_handbook validate --data-dir data
      - name: Check paper deep reads and bilingual routes
        run: |
          python3 scripts/extract_key_figures.py --check
          PYTHONPATH=src python3 scripts/check_paper_quality.py
          PYTHONPATH=src python3 scripts/render_paper_translations.py --check
          python3 scripts/render_paper_topics.py --check
      - name: Build empty initial index
        run: PYTHONPATH=src python3 -m wbc_handbook build-index --data-dir data --index var/handbook.sqlite
