name: pages

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/pages.yml"
      - "content/problems/**"
      - "content/papers/**"
      - "data/**"
      - "README.md"
      - "README.zh-CN.md"
      - "site/**"
      - "src/wbc_handbook/**"
      - "pyproject.toml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate canonical data
        run: PYTHONPATH=src python3 -m wbc_handbook validate --data-dir data
      - name: Check bilingual paper pages and routes
        run: |
          python3 scripts/extract_key_figures.py --check
          PYTHONPATH=src python3 scripts/check_paper_quality.py
          PYTHONPATH=src python3 scripts/render_paper_translations.py --check
          python3 scripts/render_paper_topics.py --check
      - name: Check generated problem pages
        run: >-
          PYTHONPATH=src python3 -m wbc_handbook render-problems
          --data-dir data --translations-dir data/locales/en/problems
          --output-dir content/problems --check
      - name: Build static bilingual search index
        run: >-
          PYTHONPATH=src python3 -m wbc_handbook build-web-index
          --data-dir data --translations-dir data/locales/en/problems
          --problems-dir content/problems
          --output site/search-index.json
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
