[metadata]
name = humanoid-wbc-handbook
version = 0.1.0
description = Offline-first, evidence-backed engineering handbook tooling for humanoid whole-body control
long_description = file: README.md
long_description_content_type = text/markdown
license = Apache-2.0

[options]
python_requires = >=3.9
package_dir =
    = src
packages = find:
include_package_data = True

[options.packages.find]
where = src

[options.entry_points]
console_scripts =
    wbc-handbook = wbc_handbook.cli:main
